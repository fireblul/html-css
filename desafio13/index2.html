<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela desafio 2</title>
    <style>
        header{
            text-align: center;
            border: 1px solid black;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            border-radius: 10px;
            width: 70%;
            margin: auto;
        }
        main{
            font-weight: bolder;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        table{
            width: 400px;
            height: 200px;
            text-align: center;
            transform: translateY(-200px);



        }
        td{
            border: 1px solid black;
            
        }

    </style>
</head>
<body>
    <header>
        <h1>Desafio parte 2</h1>
        
        
    </header>
    <main class="conteiner">
        <table class="caixa">
            <tr>
                <td colspan="4">A</td>
            
                <td rowspan="4">B</td>
            </tr>
            <tr>
                <td rowspan="4">C</td>
                <td>D</td>
                <td>E</td>
                <td>F</td>
                
            </tr>
            <tr>
                
                <td>G</td>
                <td>H</td>
                <td>I</td>
                
            </tr>
            <tr>
                
                <td>J</td>
                <td>L</td>
                <td>N</td>
                
            </tr>
            <tr>
                
                <td colspan="4">1</td>
                
            </tr>



        </table>

    </main>
</body>
</html>
