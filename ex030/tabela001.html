<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: bolder;

        }
        header > h1{
            text-align: center;
            font-size: 50px;
            font-weight: bolder;
            border: 5px solid black;
            border-radius: 15px;
        }
        table{
            width: 400px;
            height: 400px;
            text-align: left;

        }
        td{
            border: 1px solid black;
            padding: 5px;
            vertical-align: top;

        }
        .numero{
            text-align: right;
        }

    </style>

</head>
<body>
    <header>
        <h1>TABELA</h1>
    </header>
    <table>
        <tr>
            <td>A1</td>
            <td>A2</td>
            <td>A3</td>
        </tr>
         <tr>
            <td class="numero">B1</td>
            <td>B2</td>
            <td>B3</td>
        </tr>
         <tr>
            <td>C1</td>
            <td class="numero">C2</td>
            <td>C3</td>
        </tr>



    </table>
</body>
</html>
