<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela grup</title>
    <style>
        table{
            width: 400px;
            height: 250px;
            
            
        }
        td, th{
            border: 1px solid black ;
            
        }
        .cnome{
            background-color: black;
        }


    </style>
</head>
<body>
    <header>
        <h1>Tabela</h1>
    </header>
    <main>
        <table>
            <colgroup>
                <col class="cnome">
                <col class="cgrup">
                <col class="cidade">
                <col class="cprof">
            
            
            </colgroup>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissao</th>

            </tr>
            <tr>
                <td>Ana Maria</td>
                <td>S</td>
                <td>23</td>
                <td>Farmadora de Aura</td>
                
            </tr>
            <tr>
                <td>Claudio</td>
                <td>M</td>
                <td>34</td>
                <td>Super heroi</td>
                
            </tr>
            <tr>
                <td>Gustavo</td>
                <td>M</td>
                <td>67</td>
                <td>Astronauta</td>
                
            </tr>
            <tr>
                <td>Helio</td>
                <td>M</td>
                <td>21</td>
                <td>Skatista</td>
                
            </tr>
            <tr>
                <td>Maria</td>
                <td>S</td>
                <td>19</td>
                <td>Presidente</td>
                
            </tr>
            <tr>
                <td>Otavio</td>
                <td>M</td>
                <td>25</td>
                <td>Escritor</td>
                
            </tr>
        </table>
    </main>
</body>
</html>
