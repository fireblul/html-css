<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <style>
        legend{
            text-align: center;
            font-weight: bolder;
            font-size: 20px;
        }
        

    </style>

</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dasos pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required placeholder="Joao lucas">
            </p>
            <p>
                <label for="iemail">Email</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="Exemplo@gmail.com">
            </p>
            <p>
                <label for="itel" > Telefone:</label>
                <input type="tel" name="tel" id="itel" pattern="^(\d{2}\)[0-9]{4,5}--[0-9]{4}$" required placeholder="(xx) xxxxx-xxxx">
            
            </p>
        </fieldset>
    

        <p>
            <input type="submit" value="Enviar">
           <input type="reset" value="Limpar">
        </p>
    </form>    
</body>
</html>
