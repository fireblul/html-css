<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Box</title>
    <style>
        .conteiner{
            background-color: aqua;
            display: flex;
            
        }
        .item{
            background-color: aquamarine;
            border: 1px solid black;
            text-align: center;
            padding: 5px;
            flex-basis: 300px;
            
        }
        div#cxa{
            flex: 0 1 150px;


        }
        div#cxb{
            flex-shrink: 0;
            flex-grow: 1;
            
        }
        div#cxc{
            flex-shrink: 1;
            flex-grow: 0;

        }

    </style>

</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxa"> a</div>
        <div class="item" id="cxb"> b</div>
        <div class="item" id="cxc"> c</div>
       


    </div>
    
</body>
</html>
